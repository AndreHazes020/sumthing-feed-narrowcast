<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumthing Impact News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@mux/mux-player@3/dist/mux-player.css">
  <script defer src="https://unpkg.com/@mux/mux-player@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="./narrowcast-data.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #033532;
      --highlight: #C7F50A;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Loading screen */
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 1000;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--highlight);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Carousel container */
    .carousel {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Individual slide - fullscreen */
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: none;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    .slide.entering {
      animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .slide.exiting {
      animation: slideOut 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: scale(1.02);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideOut {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(0.98);
      }
    }

    /* Media section - fullscreen background */
    .slide-media {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    .slide-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slide-media .image-gallery {
      position: absolute;
      inset: 0;
    }

    .slide-media .image-gallery img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .slide-media .image-gallery img.gallery-active {
      opacity: 1;
    }

    /* Gallery counter */
    .gallery-counter {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      z-index: 5;
    }

    /* Video styles */
    .slide-media.video-media {
      background: transparent;
    }

    .video-blur-bg {
      position: absolute;
      inset: 0;
      filter: blur(40px) brightness(0.5);
      transform: scale(1.2);
      z-index: 0;
      overflow: hidden;
    }

    .video-blur-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slide-media mux-player {
      position: relative;
      width: 100%;
      height: 100%;
      --controls: none;
      --media-object-fit: contain;
      z-index: 1;
    }

    /* Bottom gradient overlay for text readability */
    .slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(3, 53, 50, 0.95) 0%,
        rgba(3, 53, 50, 0.85) 25%,
        rgba(3, 53, 50, 0.4) 50%,
        transparent 70%
      );
      pointer-events: none;
      z-index: 3;
    }

    /* Content overlay - positioned at bottom */
    .slide-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 4;
      padding: 0 3rem 4.5rem;
      max-height: 65vh;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .slide-content::-webkit-scrollbar {
      display: none;
    }

    /* Video text slide-away animation */
    .slide-content.video-text-hide {
      animation: slideTextAway 1s ease-in forwards;
    }

    @keyframes slideTextAway {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(100%); }
    }

    .slide-overlay.video-overlay-hide {
      animation: fadeOverlay 1s ease-in forwards;
    }

    @keyframes fadeOverlay {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      background: rgba(199, 245, 10, 0.15);
      color: var(--highlight);
      border: 1px solid rgba(199, 245, 10, 0.3);
      border-radius: 999px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
      width: fit-content;
      backdrop-filter: blur(8px);
    }

    .category-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--highlight);
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .partner-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .partner-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: none;
      background: #fff;
      flex-shrink: 0;
    }

    .partner-logo-placeholder {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--bg);
      border: none;
      flex-shrink: 0;
    }

    .partner-info {
      display: flex;
      flex-direction: column;
    }

    .partner-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
    }

    .publish-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .news-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text);
      max-width: 800px;
      white-space: pre-wrap;
      word-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .supporter-count {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 1rem;
      padding: 0.4rem 0.85rem;
      background: rgba(199, 245, 10, 0.1);
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .supporter-count svg {
      width: 16px;
      height: 16px;
      fill: var(--highlight);
    }

    .supporter-count strong {
      color: var(--highlight);
      font-weight: 700;
    }

    /* Company supporters: overlapping profile logos, like a social feed. */
    .supporter-social {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .supporter-avatars { display: flex; flex-shrink: 0; padding-left: 0.25rem; }
    .supporter-avatar {
      display: block;
      width: 46px;
      height: 46px;
      padding: 2px;
      margin-left: -0.25rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #C7F50A, #5bd5b0);
      box-shadow: 0 0 0 3px var(--bg);
    }
    .supporter-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #fff;
      object-fit: contain;
    }
    .supporter-caption { font-size: 0.85rem; line-height: 1.5; }
    .supporter-caption strong { color: var(--highlight); }
    .supporter-names { color: var(--text-muted); max-width: 34rem; }

    /* A shared weekly snapshot after each four field updates. */
    .sumthing-update {
      background: radial-gradient(ellipse at 95% 5%, #12574a 0%, transparent 60%), var(--bg);
    }
    .sumthing-update-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(1.5rem, 3.5vh, 3rem);
      padding: 100px clamp(1.5rem, 5vw, 6rem) 65px;
      overflow-y: auto;
    }
    .weekly-heading { display: flex; justify-content: space-between; gap: 1.5rem; align-items: end; }
    .weekly-eyebrow, .team-news-label {
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--highlight);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .weekly-title {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(2.2rem, 4vw, 4.5rem);
      font-weight: 600;
      line-height: 1.08;
      text-transform: uppercase;
      max-width: none;
    }
    .weekly-period { color: var(--text-muted); font-size: 0.9rem; white-space: nowrap; }
    .weekly-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; }
    .weekly-metric { padding: 1.5rem 0; border-top: 1px solid rgba(199,245,10,0.3); }
    .weekly-value {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(3rem, 7vw, 7.5rem);
      font-weight: 500;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: var(--highlight);
    }
    .weekly-metric-label { font-size: clamp(0.9rem, 1.3vw, 1.2rem); margin-top: 0.75rem; }
    .weekly-status { color: var(--text-muted); font-size: 0.8rem; }
    .team-news {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: clamp(1.5rem, 4vw, 4rem);
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: clamp(1.5rem, 3vh, 2.5rem);
    }
    .team-news[hidden] { display: none; }
    .team-news-date {
      font-family: 'Oswald', sans-serif;
      color: var(--highlight);
      font-size: clamp(2.5rem, 4vw, 4.5rem);
      line-height: 1.1;
      white-space: nowrap;
    }
    .team-news h2 { font-size: clamp(1.3rem, 2vw, 2rem); line-height: 1.3; margin-bottom: 0.6rem; }
    .team-news-text { font-size: clamp(0.95rem, 1.2vw, 1.2rem); line-height: 1.6; max-width: 68ch; }
    .team-news-footer { color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; margin-top: 0.6rem; }

    @media (max-width: 700px) {
      .weekly-heading { flex-direction: column; align-items: start; gap: 1rem; }
      .weekly-metrics { gap: 1rem; }
      .team-news { grid-template-columns: 1fr; gap: 1.2rem; }
      .supporter-social { gap: 0.75rem; flex-wrap: wrap; }
      .slide-content { padding: 0 1.5rem 4rem; }
    }
    @media (max-height: 650px) {
      .sumthing-update-content { justify-content: start; gap: 1rem; padding-top: 85px; }
      .weekly-title { font-size: 2.2rem; }
      .weekly-value { font-size: 3rem; }
      .weekly-metric { padding: 0.75rem 0; }
      .team-news { padding-top: 1rem; }
    }

    /* Progress bar */
    .progress-bar-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 100;
    }

    .progress-bar {
      height: 100%;
      background: var(--highlight);
      width: 0%;
      transition: width 0.3s linear;
      border-radius: 0 2px 2px 0;
    }

    /* Slide indicators */
    .slide-indicators {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
      width: calc(100% - 6rem);
      max-width: 800px;
      justify-content: center;
    }

    .indicator {
      width: 32px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.4s ease;
      cursor: pointer;
      flex: 0 1 32px;
      border: none;
      padding: 0;
    }

    .indicator.active {
      background: var(--highlight);
      width: 48px;
      flex-basis: 48px;
    }

    /* Slide counter */
    .slide-counter {
      position: fixed;
      top: 24px;
      right: 32px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      z-index: 100;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Logo / branding */
    .branding {
      position: fixed;
      top: 24px;
      left: 32px;
      display: flex;
      align-items: center;
      z-index: 100;
    }

    .brand-logo {
      height: 40px;
      width: auto;
    }

    /* No-media slide: colored background with centered text */
    .slide.no-media {
      background: var(--bg);
    }

    .slide.no-media .slide-content {
      max-height: 80vh;
    }

    .slide.no-media .news-text {
      font-size: 1.2rem;
      -webkit-line-clamp: 10;
    }

    /* Error state */
    .error-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 1000;
    }

    .error-screen h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.5rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .error-screen p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .error-screen button {
      padding: 0.65rem 1.5rem;
      background: var(--highlight);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .error-screen button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading impact updates...</div>
  </div>

  <div class="branding">
    <img class="brand-logo" src="https://cdn.prod.website-files.com/64c28276d2b840e5d9b7d9a4/66f6cd36c788b6f03fe23c26_SUMTHING.LOGO.ULTRALIME.png" alt="Sumthing">
  </div>

  <div class="slide-counter" id="slideCounter"></div>

  <div class="carousel" id="carousel"></div>

  <div class="slide-indicators" id="indicators"></div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <script>
    const API_BASE = 'https://sumthing-api.com';
    const PROJECTS_URL = `${API_BASE}/v3/projects`;
    const NEWS_URL = `${API_BASE}/v1/stories/news`;
    const SLIDE_DURATION = 10000;
    const GALLERY_INTERVAL = 3500;
    const FETCH_TIMEOUT = 30000;
    const MAX_RETRIES = 3;
    const FULL_PAGE_SIZE = 12;
    const AUTO_RELOAD_INTERVAL = 3 * 60 * 60 * 1000; // 3 hours
    const UPDATE_DURATION = 24000;
    const SHARED_SNAPSHOT_URL = 'https://raw.githubusercontent.com/AndreHazes020/sumthing-feed-narrowcast/narrowcast-data/weekly-stats.json';

    let newsItems = [];
    let currentIndex = 0;
    let slideTimer = null;
    let galleryIntervals = [];
    let sharedSnapshot = null;
    let announcements = [];

    async function fetchWithTimeout(url, timeout) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        return response;
      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') {
          throw new Error('Request timed out. Please check your connection.');
        }
        throw err;
      }
    }

    async function fetchWithRetry(url, retries = MAX_RETRIES) {
      for (let attempt = 1; attempt <= retries; attempt++) {
        try {
          const response = await fetchWithTimeout(url, FETCH_TIMEOUT);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          return response;
        } catch (err) {
          console.warn(`Fetch attempt ${attempt}/${retries} failed:`, err.message);
          if (attempt === retries) throw err;
          await new Promise(r => setTimeout(r, 2000 * attempt));
        }
      }
    }

    async function fetchProjects() {
      const response = await fetchWithRetry(PROJECTS_URL);
      const projects = await response.json();
      return projects.map(p => p.id);
    }

    async function fetchNews(projectIds, pageSize = FULL_PAGE_SIZE) {
      const params = new URLSearchParams({
        pageNumber: '0',
        pageSize: String(pageSize),
        sampling: 'true',
        withSupporters: 'true'
      });
      projectIds.forEach(id => params.append('projectIds', id));

      const response = await fetchWithRetry(`${NEWS_URL}?${params}`);
      const result = await response.json();
      return result.data || [];
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffSec = Math.floor(diffMs / 1000);
      const diffMin = Math.floor(diffSec / 60);
      const diffHr = Math.floor(diffMin / 60);
      const diffDays = Math.floor(diffHr / 24);
      const diffWeeks = Math.floor(diffDays / 7);
      const diffMonths = Math.floor(diffDays / 30);
      const diffYears = Math.floor(diffDays / 365);

      if (diffSec < 60) return 'just now';
      if (diffMin < 60) return diffMin === 1 ? 'a minute ago' : `${diffMin} minutes ago`;
      if (diffHr < 24) return diffHr === 1 ? 'an hour ago' : `${diffHr} hours ago`;
      if (diffDays === 1) return 'yesterday';
      if (diffDays < 7) return `${diffDays} days ago`;
      if (diffWeeks === 1) return 'last week';
      if (diffWeeks < 5) return `${diffWeeks} weeks ago`;
      if (diffMonths === 1) return 'last month';
      if (diffMonths < 12) return `${diffMonths} months ago`;
      if (diffYears === 1) return 'last year';
      return `${diffYears} years ago`;
    }

    function getInitials(name) {
      if (!name) return '?';
      return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    function hasVideo(item) {
      return !!(item.newsVideo && item.newsVideo.playbackRef);
    }

    function hasImages(item) {
      return item.newsImageUrls && item.newsImageUrls.length > 0;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttribute(text) {
      return escapeHtml(String(text || '')).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function buildSupporters(item) {
      const logos = sharedSnapshot?.supportersByStory?.[item.storyId]?.logos || [];
      const companies = NarrowcastData.companyLogos(logos).slice(0, 5);
      const count = Number.isSafeInteger(item.storySupporterCount) ? item.storySupporterCount : 0;
      if (!count && !companies.length) return '';
      const avatars = companies.map(company => `
        <span class="supporter-avatar" title="${escapeAttribute(company.username)}">
          <img src="${escapeAttribute(company.profileImageUrl + '-medium')}"
            alt="${escapeAttribute(company.username)}" loading="lazy"
            onerror="this.closest('.supporter-avatar').remove()">
        </span>`).join('');
      const names = companies.slice(0, 2).map(company => company.username).join(', ');
      return `<div class="supporter-social">
        ${avatars ? `<div class="supporter-avatars" aria-label="Company supporters">${avatars}</div>` : ''}
        <div class="supporter-caption">
          ${count ? `Backed by <strong>${count.toLocaleString('en-GB')} ${count === 1 ? 'supporter' : 'supporters'}</strong>` : 'Made possible together'}
          ${names ? `<div class="supporter-names">${escapeHtml(names)}${companies.length > 2 ? ' & more' : ''}</div>` : ''}
        </div>
      </div>`;
    }

    function buildSumthingUpdate(index) {
      const slide = document.createElement('div');
      slide.className = 'slide sumthing-update';
      slide.dataset.index = index;
      slide.innerHTML = `<div class="sumthing-update-content">
        <div class="weekly-heading">
          <div><div class="weekly-eyebrow">The sum of us · this week</div>
            <h1 class="weekly-title">A growing movement.<br>Real impact.</h1></div>
          <div class="weekly-period" data-weekly-period>Last 7 complete days</div>
        </div>
        <div class="weekly-metrics" aria-label="Sumthing weekly statistics">
          <div class="weekly-metric"><div class="weekly-value" data-metric="contributions">—</div><div class="weekly-metric-label">New contributions</div></div>
          <div class="weekly-metric"><div class="weekly-value" data-metric="users">—</div><div class="weekly-metric-label">New users</div></div>
          <div class="weekly-metric"><div class="weekly-value" data-metric="organizations">—</div><div class="weekly-metric-label">New companies</div></div>
        </div>
        <div class="team-news" hidden></div>
        <div class="weekly-status" data-weekly-status>Loading this week’s update…</div>
      </div>`;
      return slide;
    }

    function updateSharedContent() {
      const stats = sharedSnapshot?.stats;
      const generated = Date.parse(sharedSnapshot?.generatedAt);
      const fresh = Number.isFinite(generated) && Date.now() - generated < 12 * 60 * 60 * 1000;
      const formatDay = date => new Date(date).toLocaleDateString('en-GB', {
        day: 'numeric', month: 'short', timeZone: 'UTC'
      });
      document.querySelectorAll('.sumthing-update').forEach(slide => {
        slide.querySelectorAll('[data-metric]').forEach(element => {
          const value = stats?.[element.dataset.metric];
          element.textContent = fresh && Number.isSafeInteger(value) && value >= 0
            ? value.toLocaleString('en-GB') : '—';
        });
        if (stats?.from && stats?.to) {
          slide.querySelector('[data-weekly-period]').textContent =
            `${formatDay(stats.from)} – ${formatDay(Date.parse(stats.to) - 1)} · last 7 complete days`;
        }
        slide.querySelector('[data-weekly-status]').textContent = fresh
          ? `Together, we’re giving nature a comeback. · Updated ${new Date(generated).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Amsterdam' })}`
          : 'The weekly figures are temporarily unavailable.';
        const news = NarrowcastData.currentAnnouncement(announcements);
        const newsElement = slide.querySelector('.team-news');
        newsElement.hidden = !news;
        newsElement.innerHTML = news ? `
          <div><div class="team-news-label">${escapeHtml(news.label || 'Team news')}</div>
            <div class="team-news-date">${escapeHtml(news.date || '')}</div></div>
          <div><h2>${escapeHtml(news.title || '')}</h2>
            <div class="team-news-text">${escapeHtml(news.text || '')}</div>
            <div class="team-news-footer">${escapeHtml(news.footer || '')}</div></div>` : '';
      });
      document.querySelectorAll('[data-supporters-for]').forEach(element => {
        const item = newsItems[Number(element.dataset.supportersFor)];
        if (item) element.innerHTML = buildSupporters(item);
      });
    }

    async function loadSharedContent() {
      // Screens only read cached files. Only the scheduled task calls the
      // statistics/supporter APIs, once for all screens combined.
      const snapshotTask = (async () => {
        for (const url of [SHARED_SNAPSHOT_URL, './weekly-stats.json']) {
          try {
            const response = await fetchWithTimeout(url, 5000);
            if (!response.ok) continue;
            const snapshot = await response.json();
            if (snapshot.stats && snapshot.generatedAt) {
              sharedSnapshot = snapshot;
              updateSharedContent();
              return;
            }
          } catch { /* Try the bundled snapshot; keep the slideshow running. */ }
        }
        updateSharedContent();
      })();
      const announcementTask = (async () => {
        try {
          const response = await fetchWithTimeout('./updates.json', 5000);
          if (response.ok) announcements = (await response.json()).announcements || [];
        } catch { /* Team news is optional. */ }
        updateSharedContent();
      })();
      await Promise.allSettled([snapshotTask, announcementTask]);
    }

    function buildSlide(item, index) {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.dataset.index = index;

      const itemHasVideo = hasVideo(item);
      const itemHasImages = hasImages(item);
      const hasMedia = itemHasVideo || itemHasImages;

      if (!hasMedia) slide.classList.add('no-media');

      let mediaHTML = '';

      if (itemHasVideo) {
        mediaHTML = `
          <div class="slide-media video-media">
            <div class="video-blur-bg">
              <video
                id="mux-bg-${index}"
                data-playback-id="${item.newsVideo.playbackRef}"
                muted
                playsinline
                preload="auto"
              ></video>
            </div>
            <mux-player
              id="mux-${index}"
              playback-id="${item.newsVideo.playbackRef}"
              muted
              autoplay="false"
              preload="auto"
              max-resolution="2160p"
              style="width:100%;height:100%;--controls:none;--media-object-fit:contain;--media-background-color:transparent;background:transparent;"
            ></mux-player>
          </div>`;
      } else if (itemHasImages) {
        const images = item.newsImageUrls.map(url => url + '-large');
        if (images.length === 1) {
          mediaHTML = `
            <div class="slide-media">
              <img src="${images[0]}" alt="News image" loading="lazy">
            </div>`;
        } else {
          const imgsHTML = images.map((url, i) =>
            `<img src="${url}" alt="News image ${i + 1}" class="${i === 0 ? 'gallery-active' : ''}" loading="lazy">`
          ).join('');
          mediaHTML = `
            <div class="slide-media">
              <div class="image-gallery" data-slide="${index}">
                ${imgsHTML}
              </div>
              <div class="gallery-counter" data-gallery-counter="${index}">1 / ${images.length}</div>
            </div>`;
        }
      }

      const partnerName = item.projectPartnerName || 'Sumthing';
      const partnerLogoUrl = item.projectPartnerLogoUrl ? item.projectPartnerLogoUrl + '-large' : null;
      const categoryLabel = item.projectCategory || 'Impact Update';

      const partnerAvatar = partnerLogoUrl
        ? `<img class="partner-logo" src="${partnerLogoUrl}" alt="${escapeHtml(partnerName)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="partner-logo-placeholder" style="display:none">${getInitials(partnerName)}</div>`
        : `<div class="partner-logo-placeholder">${getInitials(partnerName)}</div>`;

      const supporterHTML = `<div data-supporters-for="${index}">${buildSupporters(item)}</div>`;

      const overlayHTML = hasMedia ? '<div class="slide-overlay"></div>' : '';

      const contentHTML = `
        <div class="slide-content">
          <div class="category-badge">${escapeHtml(categoryLabel)}</div>
          <div class="partner-row">
            ${partnerAvatar}
            <div class="partner-info">
              <div class="partner-name">${escapeHtml(partnerName)}</div>
              <div class="publish-date">${formatDate(item.newsPublishedAt || item.newsCreatedAt)}</div>
            </div>
          </div>
          <div class="news-text">${escapeHtml(item.newsText || '')}</div>
          ${supporterHTML}
        </div>
        ${overlayHTML}`;

      slide.innerHTML = mediaHTML + contentHTML;
      return slide;
    }

    function buildIndicators() {
      const container = document.getElementById('indicators');
      container.innerHTML = '';
      newsItems.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.setAttribute('aria-label', `Slide ${i + 1}${newsItems[i].kind === 'sumthing-update' ? ': Sumthing this week' : ''}`);
        dot.className = 'indicator' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => goToSlide(i));
        container.appendChild(dot);
      });
    }

    function updateIndicators() {
      const dots = document.querySelectorAll('.indicator');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
        dot.setAttribute('aria-current', i === currentIndex ? 'true' : 'false');
      });
      document.getElementById('slideCounter').textContent =
        `${currentIndex + 1} / ${newsItems.length}`;
    }

    function startProgress(duration) {
      const bar = document.getElementById('progressBar');
      bar.style.transition = 'none';
      bar.style.width = '0%';
      bar.offsetHeight; // force reflow
      bar.style.transition = `width ${duration}ms linear`;
      bar.style.width = '100%';
    }

    function resetProgress() {
      const bar = document.getElementById('progressBar');
      bar.style.transition = 'none';
      bar.style.width = '0%';
    }

    function startGalleryRotation(slideIndex) {
      const gallery = document.querySelector(`.image-gallery[data-slide="${slideIndex}"]`);
      if (!gallery) return;

      const images = gallery.querySelectorAll('img');
      if (images.length <= 1) return;

      const counter = document.querySelector(`[data-gallery-counter="${slideIndex}"]`);
      let current = 0;

      const interval = setInterval(() => {
        images[current].classList.remove('gallery-active');
        current = (current + 1) % images.length;
        images[current].classList.add('gallery-active');
        if (counter) counter.textContent = `${current + 1} / ${images.length}`;
      }, GALLERY_INTERVAL);

      galleryIntervals.push(interval);
    }

    function clearGalleryIntervals() {
      galleryIntervals.forEach(clearInterval);
      galleryIntervals = [];
    }

    function playVideoSlide(index) {
      const player = document.getElementById(`mux-${index}`);
      if (!player) return false;

      player.muted = true;
      player.currentTime = 0;
      player.play().catch(() => {});

      // Sync blurred background video
      const bgPlayer = document.getElementById(`mux-bg-${index}`);
      if (bgPlayer) {
        bgPlayer.muted = true;
        bgPlayer.currentTime = 0;
        bgPlayer.play().catch(() => {});
      }

      // Base text visibility on playback time, so buffering does not consume
      // reading time. Short videos keep their text for their entire duration.
      const slide = player.closest('.slide');
      const content = slide ? slide.querySelector('.slide-content') : null;
      const overlay = slide ? slide.querySelector('.slide-overlay') : null;
      const onTimeUpdate = () => {
        const visibleUntil = NarrowcastData.videoTextDuration(newsItems[index].newsText, player.duration);
        const hide = player.currentTime >= visibleUntil;
        slide.dataset.videoTextUntil = String(visibleUntil);
        slide.dataset.videoTime = String(player.currentTime);
        if (content) content.classList.toggle('video-text-hide', hide);
        if (overlay) overlay.classList.toggle('video-overlay-hide', hide);
      };
      player.addEventListener('timeupdate', onTimeUpdate);

      const onEnded = () => {
        player.removeEventListener('ended', onEnded);
        nextSlide();
      };
      player.addEventListener('ended', onEnded);

      const onLoaded = () => {
        if (player.duration && isFinite(player.duration)) {
          resetProgress();
          startProgress(player.duration * 1000);
        }
      };
      player.addEventListener('loadedmetadata', onLoaded);
      player._narrowcastCleanup = () => {
        player.removeEventListener('ended', onEnded);
        player.removeEventListener('loadedmetadata', onLoaded);
        player.removeEventListener('timeupdate', onTimeUpdate);
      };
      if (player.duration && isFinite(player.duration)) {
        resetProgress();
        startProgress(player.duration * 1000);
      }

      // Fallback: 5 minute max for any video
      slideTimer = setTimeout(() => nextSlide(), 300000);
      return true;
    }

    function stopVideoSlide(index) {
      const player = document.getElementById(`mux-${index}`);
      if (player) {
        player._narrowcastCleanup?.();
        player._narrowcastCleanup = null;
        player.pause();
      }
      const bgPlayer = document.getElementById(`mux-bg-${index}`);
      if (bgPlayer) {
        bgPlayer.pause();
      }
    }

    function goToSlide(index) {
      if (!newsItems.length || index < 0 || index >= newsItems.length || index === currentIndex) return;

      clearTimeout(slideTimer);
      clearGalleryIntervals();
      resetProgress();

      const slides = document.querySelectorAll('.slide');
      const currentSlide = slides[currentIndex];
      const nextSlideEl = slides[index];

      stopVideoSlide(currentIndex);

      // Reset video text hide and overlay fade on current slide
      const currentContent = currentSlide.querySelector('.slide-content');
      if (currentContent) currentContent.classList.remove('video-text-hide');
      const currentOverlay = currentSlide.querySelector('.slide-overlay');
      if (currentOverlay) currentOverlay.classList.remove('video-overlay-hide');

      currentSlide.classList.remove('active');
      currentSlide.classList.add('exiting');

      nextSlideEl.classList.add('active', 'entering');

      setTimeout(() => {
        currentSlide.classList.remove('exiting');
        nextSlideEl.classList.remove('entering');
      }, 800);

      currentIndex = index;
      if (newsItems[index].kind === 'sumthing-update') updateSharedContent();
      updateIndicators();
      startSlideTimer();
    }

    function nextSlide() {
      if (!newsItems.length) return;
      clearTimeout(slideTimer);
      const next = (currentIndex + 1) % newsItems.length;
      goToSlide(next);
    }

    function startSlideTimer() {
      clearTimeout(slideTimer);

      const item = newsItems[currentIndex];
      if (!item) return;

      if (item.kind === 'sumthing-update') {
        startProgress(UPDATE_DURATION);
        slideTimer = setTimeout(() => nextSlide(), UPDATE_DURATION);
        return;
      }

      if (hasVideo(item)) {
        const played = playVideoSlide(currentIndex);
        if (played) return;
      }

      if (hasImages(item) && item.newsImageUrls.length > 1) {
        startGalleryRotation(currentIndex);
        // Give enough time to show every image in the gallery
        const imageCount = item.newsImageUrls.length;
        const galleryDuration = imageCount * GALLERY_INTERVAL + GALLERY_INTERVAL;
        startProgress(galleryDuration);
        slideTimer = setTimeout(() => nextSlide(), galleryDuration);
        return;
      }

      startProgress(SLIDE_DURATION);
      slideTimer = setTimeout(() => nextSlide(), SLIDE_DURATION);
    }

    function initBgVideos() {
      document.querySelectorAll('.video-blur-bg video[data-playback-id]').forEach(video => {
        if (video._hlsInit) return;
        video._hlsInit = true;
        const src = `https://stream.mux.com/${video.dataset.playbackId}.m3u8`;
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = src;
        } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
          const hls = new Hls({ maxMaxBufferLength: 10 });
          hls.loadSource(src);
          hls.attachMedia(video);
          video._hls = hls;
        }
      });
    }

    function renderSlides(items, startIndex) {
      const carousel = document.getElementById('carousel');
      items.forEach((item, i) => {
        const slide = item.kind === 'sumthing-update'
          ? buildSumthingUpdate(startIndex + i) : buildSlide(item, startIndex + i);
        if (startIndex === 0 && i === 0) slide.classList.add('active');
        carousel.appendChild(slide);
      });
      initBgVideos();
    }

    async function init() {
      const sharedContentTask = loadSharedContent();
      try {
        const projectIds = await fetchProjects();
        if (!projectIds.length) {
          showError('No projects found', 'The projects API returned no results.');
          return;
        }

        const initialItems = await fetchNews(projectIds, FULL_PAGE_SIZE);
        if (!initialItems.length) {
          showError('No news items found', 'The API returned no results.');
          return;
        }

        newsItems = NarrowcastData.playlist(initialItems);
        renderSlides(newsItems, 0);
        updateSharedContent();
        buildIndicators();
        updateIndicators();
        document.getElementById('loading').classList.add('hidden');
        startSlideTimer();

        await sharedContentTask;

      } catch (err) {
        console.error('Failed to load news:', err);
        showError('Failed to load news', err.message);
      }
    }

    function showError(title, message) {
      document.getElementById('loading').classList.add('hidden');
      const errDiv = document.createElement('div');
      errDiv.className = 'error-screen';
      errDiv.innerHTML = `
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(message)}</p>
        <button onclick="location.reload()">Try Again</button>`;
      document.body.appendChild(errDiv);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        const prev = (currentIndex - 1 + newsItems.length) % newsItems.length;
        goToSlide(prev);
      }
    });

    init();

    // Auto-reload every 3 hours to pick up new content
    setInterval(() => location.reload(), AUTO_RELOAD_INTERVAL);
  </script>
</body>
</html>
